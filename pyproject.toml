[project]
name = "agora"
version = "0.1.0"
description = "Simulador social multiagente, agnóstico a ambientación y a sistema de rol."
readme = "README.md"
authors = [
    { name = "Jhon Coneo", email = "jconeo117@gmail.com" }
]
requires-python = ">=3.12"
# F0 no depende de ningún LLM. A propósito.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest>=8.3",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# mypy en estricto: recupera la red de seguridad de tipos que da C#.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
