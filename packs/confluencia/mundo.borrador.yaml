# borrador de mundo, escrito por un modelo: revísalo y guárdalo como `mundo.yaml` junto al pack.
# No se usa hasta que lo guardes.
premise: Este mundo es un lugar de gran diversidad, donde diferentes especies y razas
  coexisten en un entorno de magia y aventuras. La sociedad está organizada en torno
  a gremios y casas, y las personas se dedican a various oficios y aficiones. El mundo
  está lleno de lugares emblemáticos, como la plaza mayor, el mercado central y la
  academia arcana, donde la gente se reúne para intercambiar bienes y conocimientos.
tone: Se cuenta de manera sobria y objetiva, sin adornos ni emociones exageradas.
known:
- La magia es una parte fundamental de la vida en este mundo.
- La lucha por el poder y el dominio es constante.
- La escasez de recursos naturales es un problema común.
- El conocimiento y la sabiduría son altamente valorados.
- La seguridad y la protección son necesidades básicas que deben ser satisfechas.
