# Mapa de la ciudad — versión ampliada
#
# Affordance nueva respecto al doc original:
#   trabajo | empleo civil (no aventurero) | minas, canteras, granjas, muelles, forjas
#   (distinta de `contratos`, que es específicamente trabajo de gremio/aventurero)
#
# Zonificación por raza inteligente (doc de razas, sección 2):
#   Centro     — humano, administrativo, conecta todo
#   Elfos      — bosque cercano a la ciudad, contemplativo
#   Enanos     — minas y forjas
#   Gigantes   — plazas y estructuras de escala mayor, cantera
#   Demihumanos— caza y granja, totems animales
#   Puerto     — humanos costeros (no es una raza, es la identidad económica humana)
#   Academia   — institución grande, mixta, donde se persigue teoría y multiafinidad
#   Bajos      — catacumbas, línea ley, mazmorras, cripta de invocaciones/no-muertos
#   Bosque Salvaje — donde viven las razas monstruo (orcos, goblins, ogros, dragonewts);
#                    aquí es donde, rarísimamente, podría emerger un majin (ver razas.md)
#
# Los demonios NO tienen barrio propio — no habitan el plano físico (razas.md, sección 2).
# Su "lugar" es la Cripta Olvidada, en Los Bajos: el sitio donde ocurren invocaciones
# y donde también se reportan apariciones de no muertos, liches y vampiros.

