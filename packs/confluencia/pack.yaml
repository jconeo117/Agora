- id: cobrar_deuda
  label: cobrar una deuda por la fuerza
  requires_edad: 622080  # cobrar por la fuerza no es cosa de ninyos (D-070)
  # Usa `por_deuda` (D-063): apunta a quien de los presentes le debe más al
  # ASESINO mismo, no al que más aprecia ni al que más le debe daño. Encima
  # del goteo pasivo de la propiedad DEUDA (`renta`, cobrado solo por existir)
  # este es el sobresalto: una suma mayor, de una vez, y a costa de un golpe.
  #
  # `deuda_weight: 0.0` y no un peso real: `renta` es una TASA por tick (aquí
  # 0.015-0.02), no un saldo total, así que meterla dentro de `disposicion`
  # (que espera algo cerca de [0, 1] como el agravio) la aplastaba a un
  # factor ~0.2 y `cobrar_deuda` nunca competía con nada. Con la puerta
  # (`min_deuda`) ya filtrando quién debe de verdad, la disposición no
  # necesita encoger además por cuánto -- se cobra igual de a gusto una
  # deuda pequeña que una algo mayor, como la codicia de `por_desconocido`.
  #
  # `satisfies` alto y no moderado: `candidate_pool: 3` solo deja competir a
  # los tres mejores por deliberación, así que un servicio que solo es
  # candidato cuando el deudor está delante (la puerta `elegir_destinatario`
  # ya lo exige) necesita GANAR ese instante estrecho, no quedarse en el
  # puesto nueve de trescientos y no ocurrir nunca. Medido: con dinero 0.5 /
  # dominio 0.15 nunca entraba en los tres finalistas en 30 días; con 1.0 /
  # 0.5 es el primero cuando hay a quién cobrarle, y solo entonces.
  duration_ticks: 6
  requires_company: 1
  requires_traits:
    asesino: 0.3
  satisfies:
    dinero: 1.0
    dominio: 0.5
  costs:
    descanso: 0.2
  effects:
    dinero: 0.24
    dominio: 0.06
    descanso: -0.08
  target:
    gives:
      dinero: -0.24
      salud: -0.05
    por_deuda: true
    # 0.003 y no 0.01: desde que `prestar_dinero` (D-065) crea deudas en marcha,
    # la puerta tiene que dejar pasar tambien la tasa de un prestamo reciente y
    # no solo la de las cuatro deudas escritas a mano (0.015-0.02).
    min_deuda: 0.003
    deuda_weight: 0.0
# El otro extremo de `cobrar_deuda` (D-065). Hasta aqui las deudas de este
# mundo estaban escritas a mano en `properties`, y quien le debia a quien se
# decidia antes del tick cero; esta accion las crea en marcha, y es lo primero
# que el motor hace nacer durante una partida.
#
# Sin puerta de clase (D-060): la puerta la pone el bolsillo (`requires:
# dinero`), que es una condicion GANADA y no una etiqueta -- se cruza teniendo
# con que prestar, no habiendo nacido prestamista.
#
# Presta 0.25 y le quedan debiendo 0.30: un veinte por ciento de interes,
# ESCRITO y no calculado. El motor no relaciona `gives` con `saldo` -- hacerlo
# le exigiria saber cual de los ejes es el dinero.
#
# `satisfies` es vinculo y no dinero, y no es un descuido. Prestar CUESTA
# dinero en el momento (`effects`), y el interes llega despues por un goteo
# pasivo que nadie atribuye a la accion; un agente que decide por tick no puede
# razonar un retorno a cien ticks vista. Lo que le mueve a prestar es el favor.
# El negocio se lo lleva igual.
- id: prestar_dinero
  label: prestar dinero
  requires_edad: 622080  # prestar no es cosa de ninyos (D-070)
  duration_ticks: 4
  requires_affordance: contratos
  requires_company: 1
  requires:
    dinero: 0.25
  # `dominio` y no `vinculo` a secas, aunque prestar sea un favor. Medido: con
  # `vinculo: 1.0` la accion era candidata 154 veces en 2 dias y entraba en el
  # pool de tres UNA -- caia al puesto 33-48 detras de `charlar`, que da el
  # mismo vinculo y no cuesta nada. Ninguna calibracion del coste arregla eso:
  # mientras el premio sea el mismo que el de la alternativa gratis, prestar es
  # estrictamente peor. Tener a alguien en deuda es la unica cosa que prestar da
  # y charlar no, y este mundo ya la llama `dominio` en `cobrar_deuda`.
  #
  # Lo que NO se puede escribir aqui es `dinero`, por mucho que el prestamo
  # devuelva un veinte por ciento mas: `gain_beliefs` corrige `satisfies` contra
  # los `effects` reales, y el interes no llega por `effects` sino por el goteo
  # pasivo de la propiedad. El agente desaprenderia la promesa en unos dias y la
  # accion moriria sola.
  satisfies:
    dominio: 0.8
    vinculo: 0.5
  costs:
    dinero: 0.25
  effects:
    dominio: 0.01
    vinculo: 0.1
    dinero: -0.25
  saturation_gain: 0.2
  target:
    gives:
      dinero: 0.25
    # Se presta a quien se aprecia, pero no solo: `regard_weight` encoge y no
    # veta, asi que prestarle a un desconocido sigue valiendo la mitad.
    regard_weight: 0.5
    # 0.003 por tick sobre un saldo de 0.30: cien ticks, poco mas de un dia de
    # este reloj. Mas lento seria invisible para `cobrar_deuda`, cuya puerta
    # mira la TASA y no el saldo (D-064); mas rapido no seria un prestamo.
    crea_deuda:
      renta:
        dinero: 0.003
      saldo:
        dinero: 0.30
# Engendrar (D-071). Hacen falta dos, y no cualquiera dos: la puerta de quien
# ACTUA pide `mujer` y la del DESTINATARIO pide `varon` (D-070), que es la
# pieza que faltaba -- un rasgo de quien actua no dice nada del otro. Los dos
# mayores de edad, con la puerta puesta en las dos mitades: con una sola se
# escribiria media regla y la mitad que falta no se ve en el log.
#
# Se escribe desde el lado de ELLA y no de el, y por una razon mecanica: la
# espera se la queda quien actua (`inflicts`, no `target.inflicts`), y asi la
# accion no depende de que el varon decida nada. `Condicion.por_quien` guarda
# igualmente de quien es, porque una condicion que te queda de algo hecho CON
# otro tiene por autor a ese otro.
#
# `forbids_condition` es el candado: quien ya espera no vuelve a empezar. Es la
# unica puerta en negativo del motor, y sin ella habria que modelar "esta
# disponible" con un eje que baje a cero, que es un numero donde lo que hay es
# un si o un no.
#
# No pide relacion ninguna a proposito: no hace falta ser pareja, y exigirlo
# convertiria toda la descendencia de este mundo en descendencia de matrimonio.
- id: engendrar
  label: buscar descendencia
  duration_ticks: 6
  requires_affordance: cama
  requires_company: 1
  requires_traits:
    mujer: 0.5
  requires_edad: 622080
  forbids_condition: gestacion
  satisfies:
    deseo: 1.0
    vinculo: 0.3
  costs:
    descanso: 0.3
  effects:
    deseo: 0.55
    vinculo: 0.06
    descanso: -0.05
  inflicts:
    situation: gestacion
    lasts: 25920
  saturation_gain: 0.3
  target:
    gives:
      deseo: 0.5
      vinculo: 0.06
    requires_traits:
      varon: 0.5
    requires_edad: 622080
    # Se busca antes con quien se aprecia, pero encoge y no veta: este mundo no
    # exige carinyo para esto, solo lo hace mas probable.
    regard_weight: 0.45
# El mismo trato desde el otro lado. Dos acciones y no una porque una accion
# tiene UN actor, y con solo la version de ella los varones no tenian forma de
# resolver `deseo` por su cuenta: medido, el eje se quedaba en 0.48 de oferta y
# el tiempo en crisis subia del 11.5% al 45%. La mitad de la poblacion con una
# carencia que no podia tocar no es un mundo desigual, es un eje roto.
#
# La diferencia con la de ella es donde cae la espera: aqui es `target.inflicts`
# (se la deja a la otra), alli era `inflicts` (se la queda quien actua). El
# motor apunta al autor en los dos casos, asi que el hijo sabe de quien es
# venga de donde venga.
- id: engendrar_con
  label: buscar descendencia
  duration_ticks: 6
  requires_affordance: cama
  requires_company: 1
  requires_traits:
    varon: 0.5
  requires_edad: 622080
  satisfies:
    deseo: 1.0
    vinculo: 0.3
  costs:
    descanso: 0.3
  effects:
    deseo: 0.55
    vinculo: 0.06
    descanso: -0.05
  saturation_gain: 0.3
  target:
    gives:
      deseo: 0.5
      vinculo: 0.06
    requires_traits:
      mujer: 0.5
    requires_edad: 622080
    forbids_condition: gestacion
    regard_weight: 0.45
    inflicts:
      situation: gestacion
      lasts: 25920
# Criar (D-076). Es lo que hace que "acabar queriendolo" tenga numeros detras.
# Medido antes de esto: 210 vinculos padre/madre -> hijo con mediana de aprecio
# +0.001 y maximo +0.130. El aprecio solo crece por `remember_company` -- por
# compartir algo -- y nadie comparte nada con un crio, asi que el vinculo no
# arrancaba nunca. Un padre que no lo buscaba se quedaba en su 0.04 de por vida,
# y eso convierte una decision de dise~no en un callejon.
#
# `requires_condition: infancia` y no una edad maxima: el motor sabe exigirle al
# destinatario una edad MINIMA, no un techo. Una condicion si se ve estando
# delante, y la ni~nez es exactamente eso -- algo que se lleva encima y se pasa
# solo.
#
# No pide ser el padre. Cuidar del crio de otro es una cosa que pasa, y gatearlo
# por relacion dejaria fuera al abuelo, al vecino y al maestro. Lo que hace que
# normalmente sea el padre es el `regard_weight`: se cuida antes a quien se
# quiere, y a un hijo buscado se le quiere de entrada.
- id: criar
  label: criar
  duration_ticks: 10
  requires_affordance: quietud
  requires_company: 1
  requires_edad: 622080
  # `deseo` y no solo `vinculo`, y es la leccion de E-009 por tercera vez: con
  # `vinculo: 1.0` a secas la accion promete exactamente lo que `charlar` da
  # gratis en 17 sitios, y ocurria 10 veces en 400 dias. Criar satisface el
  # mismo impulso que buscar descendencia -- quien ya esta criando no anda
  # buscando otro -- asi que compite con `engendrar` por su eje, que es lo que
  # tiene que pasar.
  satisfies:
    deseo: 0.85
    vinculo: 0.4
  costs:
    descanso: 0.35
  effects:
    deseo: 0.3
    vinculo: 0.15
    descanso: -0.08
  saturation_gain: 0.15
  target:
    requires_condition: infancia
    gives:
      vinculo: 0.3
      sustento: 0.12
    regard_weight: 0.5
# Los tuyos por delante de los desconocidos. `charlar` da vinculo gratis en 17
# sitios y con quien sea; esto pide que este delante alguien tuyo, y a cambio
# rinde bastante mas -- que es como se escribe "es mas reconfortante estar con
# tu gente que salir a charlar con cualquiera" sin que el motor sepa lo que es
# una familia. El `company_multiplier` de las relaciones de sangre (2.2 y 1.9)
# hace el resto: la misma compania vale mas si es la tuya.
#
# Dos acciones y no una, por lo mismo que `engendrar`: `requires_relation` mira
# UNA relacion, y una madre tiene `madre` donde un padre tiene `padre`.
- id: velar_por_los_suyos
  label: velar por los suyos
  duration_ticks: 5
  requires_affordance: quietud
  requires_company: 1
  requires_relation: madre
  requires_edad: 622080
  satisfies:
    vinculo: 1.0
    deseo: 0.55
  costs:
    descanso: 0.08
  effects:
    vinculo: 0.34
    deseo: 0.14
    descanso: -0.02
  effects_per_company:
    vinculo: 0.5
  saturation_gain: 0.14
- id: velar_por_los_suyos_padre
  label: velar por los suyos
  duration_ticks: 5
  requires_affordance: quietud
  requires_company: 1
  requires_relation: padre
  requires_edad: 622080
  satisfies:
    vinculo: 1.0
    deseo: 0.55
  costs:
    descanso: 0.08
  effects:
    vinculo: 0.34
    deseo: 0.14
    descanso: -0.02
  effects_per_company:
    vinculo: 0.5
  saturation_gain: 0.14
# Presentar al crio a los tuyos, y que le quede algo de ello (D-082). No pide
# ser el padre: cuidar del crio de otro es una cosa que pasa, y gatearlo por
