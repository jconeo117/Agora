situations:
# La espera (D-071). Nueve meses de este reloj: 96 ticks/dia * 30 dias * 9 =
# 25920, y el plazo lo pone quien la pega (`engendrar`), no esto -- una
# situacion personal no declara su duracion, la declara el `inflicts` que la
# cuelga.
#
# Hace algo MIENTRAS dura, y no es adorno: cansa, y quita ganas de pelear y de
# viajar. Sin eso seria una etiqueta invisible durante nueve meses de la que un
# dia sale una persona.
#
# `al_expirar` es lo que nace: hereda el temperamento de los dos mezclado,
# sortea el genero, y entra emparentado con quien lo llevaba y -- si sigue vivo
# -- con quien lo engendro.
# La ninyez (D-076). Una condicion que se pasa sola a los dieciocho anyos, y
# que existe por una razon mecanica antes que narrativa: el motor sabe exigirle
# al destinatario una edad MINIMA, no una maxima, asi que sin esto no hay forma
# de escribir una accion que solo valga sobre un crio. Una condicion si se ve
# estando delante.
#
# Y de paso hace algo mientras dura, que es lo que la separa de una etiqueta:
# un ninyo aprende mas rapido lo que le ensenyan y rinde menos en un oficio.
# La vejez (D-084). Se pega sola a los cincuenta y no se pasa: lo que llega con
# la edad no se cura.
#
# `gravedad_por_rango` es lo que hace que no le caiga igual a todo el mundo, y
# que la diferencia sea lo que HICISTE con tu vida y no con lo que naciste: un
# rango solo se rompe trabajando el eje, y `dominio` es el unico eje de este
# mundo que los tiene. Sirve para las dos vias a la vez sin declarar nada mas:
# lo suben `practicar` y `templar_el_cuerpo`, pero tambien `estudiar` y los
# cuatro `conjurar_*`. El veterano de rango altisimo y el mago que alarga su
# vida son el mismo numero.
#
#   gravedad = 1 / (1 + 0.09 * rango)
#     rango  0 (sedentario)   1.00 -> ~15 anyos hasta vaciar la salud
#     rango  5               0.69 -> ~22
#     rango 12               0.48 -> ~31
#     rango 25               0.31 -> ~48, es decir se muere de otra cosa antes
#
# El drenaje sale de la cuenta al reves: 1.0 de salud entre quince anyos de este
# reloj (15 * 34560 ticks) es 1.929e-06 por tick, y `lethal_after: 288` remata
# los tres dias finales. Nadie se muere de viejo de golpe.
- id: vejez
  label: viejo
  personal: true
  desde_edad: 1728000
  gravedad_por_rango:
    dominio: 0.09
  effects:
    salud: -1.929e-06
  gain_multipliers:
    dominio: 0.7
    hierro: 0.6
  temperament_multipliers:
    travel_discount: 0.82
    novelty_weight: 0.7
- id: infancia
  label: crio
  personal: true
  gain_multipliers:
    dominio: 0.45
    mana: 0.45
    hierro: 0.3
    vinculo: 1.2
  temperament_multipliers:
    travel_discount: 0.8
    novelty_weight: 1.4
- id: gestacion
  label: esperando
  personal: true
  effects:
    descanso: -0.0006
  gain_multipliers:
    dominio: 0.75
  temperament_multipliers:
    travel_discount: 0.88
  al_expirar:
    # Los diez ejes de temperamento y las cuatro afinidades. Las razas y las
    # clases NO: un hijo de enano y elfa tendria 0.5 de cada una, que no es
    # "mestizo" sino "medio enano y medio elfo a la vez", y eso son dos cosas
    # distintas que el motor no sabe distinguir. Queda anotado.
    hereda_traits:
    - audacia
    - impulsividad
    - calculo
    - arraigo
    - sociabilidad
    - curiosidad
    - constancia
    - docilidad
    - apego
    - ambicion
    - codicia
    - gula
    - pereza
    - devocion
    - aprension
    - afin_fuego
    - afin_agua
    - afin_tierra
    - afin_viento
    # Sin ruido dos hermanos serian identicos y la sangre no explicaria nada
    # que no explicara ya el apellido.
    ruido: 0.15
    # Sin esto la atraccion se acaba en una generacion: los gustos son la unica
    # forma de que a alguien le atraiga alguien, y un nacido no tiene YAML donde
    # escribirselos.
    hereda_tastes: true
    # Y las metas de los dos (D-132). Es lo que hace que una casa tenga
    # costumbres sin declararlas: un agente no tiene politicas -- delibera por
    # utilidad cada tick-- y lo unico que dice "esto es lo que persigo" es una
    # meta. Una casa que transmite su oficio no es una bandera en la faccion,
    # es que sus hijos quieren lo que querian sus padres y los de la casa de al
    # lado no.
    hereda_goals: true
    sortea_traits:
    - - varon
      - mujer
    initial_needs:
      # Nace sin la carencia, no con ella al maximo: el eje ya no interrumpe
      # nada (`urgent_when_low: false`), pero dejarlo en 0 haria que la primera
      # deliberacion de una criatura fuera ir a buscar pareja y chocar contra
      # la puerta de edad una y otra vez durante dieciocho anyos.
      deseo: 1.0
      dominio: 0.0
    # El apellido (D-129). Del padre y, si no lo hay o no tiene, de la madre:
    # `de` es un orden de preferencia, no una eleccion, y eso es lo que evita
    # que un hijo de padre desconocido se quede sin casa.
    hereda_faccion:
    - tipo: casa
      de:
      - causante
      - portador
    # Y si ninguno de los dos tiene, esta criatura estrena el linaje, con sus
    # dos progenitores dentro.
    funda_faccion: casa
    relacion_con_portador: hijo_de_madre
    relacion_con_causante: hijo_de_padre
    label: cria de
    # Nace crio, y deja de serlo a los dieciocho por si solo.
    inflicts:
      situation: infancia
      lasts: 622080
    # Y aqui esta la diferencia entre un padre y otro (D-076). No es un suelo de
    # aprecio por relacion: un suelo se lo pone a todo el mundo igual, y lo que
    # separa a dos padres del mismo hijo es si lo QUISIERON antes -- si tenian
    # por meta tener descendencia. El que no lo buscaba arranca casi en cero, ni
    # carinyo ni rencor, y sube conviviendo como cualquier otro vinculo: puede
    # acabar queriendolo si esta presente, y no si no lo esta.
    regard_buscado: 0.62
    regard_no_buscado: 0.04
    regard_hacia_progenitores: 0.5
    # Y lo que consiguieron juntos es un hecho entre ELLOS, que ningun premio
    # hacia la criatura puede decir. Solo si los dos lo querian.
    regard_entre_progenitores: 0.18
    goals:
    - ser_madre
    - ser_padre
