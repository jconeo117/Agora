id: confluencia
label: Confluencia
clock:
  minutes_per_tick: 15
  ticks_per_day: 96
  days_per_year: 360
  phases:
  - id: manana
    label: manana
    starts_at: 24
  - id: tarde
    label: tarde
    starts_at: 52
  - id: noche
    label: noche
    starts_at: 80
health:
  days: 14
  seeds:
  - 4271
  min_crisis: 0.02
  max_crisis: 0.4
  max_abort_ratio: 0.3
  max_transit: 0.35
  min_differentiation: 0.4
  may_go_unused:
  - holgazanear
  - socorrer
  - canalizar_linea_ley
  - convidar
  - sostener_un_pacto
  - trabajo_sucio
  # La cadena completa (aprender -> cruzar la puerta -> minar lo suficiente
  # -> forjar -> tener stock) tarda más de 14 días en dar su primer fruto, y
  # el segundo lote de servicios (escoltar/curar_con_magia/dar_clase_de_cultura)
  # le compite el tiempo de sobra a quien todavía está aprendiendo. Medido:
  # `forjar_espada` pasa de ocurrir dentro del contrato corto a necesitar la
  # ventana de 21 días (0.45/agente) en cuanto existen alternativas de pago
  # más rápidas; `vender_espada` cae de 7 a 2 en el mismo plazo. Es un ciclo
  # económico que necesita tiempo real y ahora compite de verdad por ese
  # tiempo -- no contenido muerto; forzar el número aquí sería calibrar
  # contra la ventana en vez de contra el mundo.
  - forjar_espada
  - vender_espada
  # `criar` no puede ocurrir en catorce dias por construccion, y no por estar
  # muerta: la espera dura 25920 ticks (nueve meses), asi que en la ventana del
  # panel no existe todavia ningun crio al que criar. Es el unico caso del pack
  # en que la ventana no es corta sino de otra escala que el mecanismo: medirla
  # exige una corrida larga aparte (medido a 400 dias con `--skip 7`).
  - criar
  # Lo mismo, y por lo mismo: en catorce dias nadie tiene hijos todavia ni hay
  # ningun crio al que apadrinar.
  - velar_por_los_suyos
  - velar_por_los_suyos_padre
  - apadrinar
  # Los grupos los funda la gente, y fundar uno pide rango 3 de dominio, que en
  # catorce dias no lo tiene nadie. Todo lo que cuelga de que exista un gremio
  # queda fuera del panel por construccion: se mide con una corrida larga.
  - fundar_gremio
  - servir_al_gremio
  - reclutar_para_el_gremio
  - disputa_de_gremios
  - honrar_a_la_casa
  - ensenyar_el_oficio
