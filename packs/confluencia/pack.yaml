  costs:
    descanso: 0.15
  effects:
    vinculo: 0.26
    dominio: 0.004
    descanso: -0.03
  saturation_gain: 0.5
  target:
    requires_condition: infancia
    min_regard: 0.1
    gives:
      vinculo: 0.28
    crea_relacion: padrino
# Cortejar (D-086). Lo que faltaba para que las parejas se formen en vez de venir
# escritas: hoy 62 de 200 tienen pareja, declarada en el tick 0.
#
# `acerca` es el flechazo: un salto de aprecio de golpe en vez del goteo de
# `remember_company`. Hay vinculos que no se van cocinando, pasan.
#
# A quien se corteja lo decide la ATRACCION (`afinidad`), que desempata cuando
# el aprecio es igual -- y entre dos desconocidos siempre lo es, que es
# exactamente donde empieza todo. Antes ese caso lo resolvia el orden
# alfabetico del id.
- id: cortejar
  label: cortejar
  duration_ticks: 4
  requires_affordance: corrillo
  requires_company: 1
  requires_edad: 622080
  satisfies:
    vinculo: 1.0
    deseo: 0.5
  costs:
    descanso: 0.1
  effects:
    vinculo: 0.22
    deseo: 0.08
    descanso: -0.03
  saturation_gain: 0.35
  target:
    requires_edad: 622080
    gives:
      vinculo: 0.2
    acerca: 0.22
    crea_relacion: pareja
# Fundar un gremio (D-090). Tercera entidad que el motor crea en marcha, y la
# primera COLECTIVA. Pide rango y dinero, no un rasgo: montar un oficio
# organizado es algo que se GANA -- quien llego lejos en lo suyo y tiene con que
# -- y no una etiqueta con la que se nace.
- id: fundar_gremio
  label: fundar un gremio
  duration_ticks: 12
  requires_affordance: contratos
  requires_edad: 622080
  # Quien ya tiene gremio no funda otro (D-127). Sin esta puerta, fundar
  # competia con unirse en igualdad y ganaba siempre, porque fundar no depende
  # de que nadie te acepte: medido, 137 gremios para 247 personas y 68 de ellos
  # de un solo miembro.
  forbids_faccion: gremio
  # Rango 4 y no 3 ni 6, y sale de medir el reparto real a 400 dias: con 3 lo
  # cumple el 54% de la poblacion, con 4 el 17% (35 personas) y con 6 solo el
  # 1% -- dos personas en todo el mundo, que ademas tenian que tener el dinero,
  # estar donde hay contratos y ganar la deliberacion. Con 6 salieron CERO
  # gremios en 400 dias; con 3, ciento treinta y siete.
  requires_rank:
    dominio: 4
  requires:
    dinero: 0.4
  satisfies:
    dominio: 0.6
    vinculo: 0.5
  costs:
    dinero: 0.6
    descanso: 0.3
  effects:
    dinero: -0.35
    vinculo: 0.1
    descanso: -0.08
  funda_faccion: gremio
  # Alta a proposito: fundar es algo que se hace una vez en la vida, no una
  # rutina. El hartazgo la aparta durante mucho tiempo despues de intentarlo.
  saturation_gain: 0.95
# Lo que sostiene un gremio: trabajar para el. Sube la lealtad, que es lo unico
# que frena el desgaste -- quien no hace nada por los suyos acaba fuera.
- id: servir_al_gremio
  label: servir al gremio
  duration_ticks: 8
  requires_affordance: contratos
  requires_faccion: gremio
  satisfies:
    dinero: 0.7
    dominio: 0.3
  costs:
    descanso: 0.35
  effects:
    dinero: 0.22
    dominio: 0.006
    descanso: -0.09
  lealtad: 0.06
  saturation_gain: 0.12
# Reclutar. Solo un miembro con peso, y a quien ya se aprecia: un gremio no se
# llena de desconocidos por la calle.
- id: reclutar_para_el_gremio
  label: reclutar para el gremio
  duration_ticks: 6
  requires_affordance: corrillo
  requires_company: 1
  requires_faccion: gremio
  requires_lealtad: 0.5
  satisfies:
    vinculo: 1.0
    dominio: 0.5
  costs:
    descanso: 0.1
  effects:
    vinculo: 0.2
    descanso: -0.03
  lealtad: 0.04
  # Baja: reclutar es la rutina de un gremio, no un hito. Con la de fundar alta
  # y esta baja, el mundo se llena de miembros y no de fundadores.
  saturation_gain: 0.1
  target:
    requires_edad: 622080
    min_regard: 0.2
    gives:
      vinculo: 0.22
    suma_a_faccion: gremio
# Y lo que convierte grupos en politica: pegarle a alguien de OTRO gremio
# enemista a los dos. `otra_faccion` no es la negacion de `misma_faccion` --
# quien no pertenece a ninguno tampoco vale, porque hacen falta DOS gremios
# para que haya algo que enemistar.
- id: disputa_de_gremios
