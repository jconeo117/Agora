# El eje que mueve a engendrar (D-071). Existe por la leccion de E-009: una
# accion cuyo premio ya lo sirve algo gratis no gana nunca, y todo lo social de
# este mundo lo paga `vinculo`, que `charlar` da sin coste en 17 sitios. Buscar
# descendencia tiene que pedir algo que no pida ninguna otra cosa.
#
# `base_weight` bajo (0.3) y decaimiento lento a proposito: es el mismo remedio
# que `saber_minar` (D-062). Sin bajarlo, un eje que solo una accion con cuatro
# puertas puede llenar dejaria a media poblacion -- los menores, los que no
# encuentran con quien -- arrastrando una carencia que no pueden resolver.
- id: deseo
  label: deseo
  # 0.00026 y no 0.00018: al anyadir `cortejar` (D-086) la oferta del eje subio
  # a 1.35 y el panel lo declaro MUERTO -- por encima de 1.3 un eje deja de
  # decidir nada. Se colo sin verse porque las mediciones de esa tanda miraban
  # las parejas y no el reparto de oferta.
  decay_per_tick: 0.00026
  initial: 0.62
  base_weight: 0.3
  urgency_exponent: 1.4
  # No es una emergencia, es un impulso: sigue apeteciendo llenarlo y con la
  # misma curva, pero pierde el poder de interrumpir lo que se este haciendo.
  # Sin esto los NINYOS lo pagan: nacen con el eje vacio, no pueden tocarlo
  # hasta los dieciocho, y pasarian toda la infancia contando como poblacion en
  # crisis. Es exactamente el caso del inventario -- la bolsa vacia es un
  # martes -- visto desde la otra punta de la vida.
  urgent_when_low: false
- id: vinculo
  label: vinculo
  decay_per_tick: 0.003
