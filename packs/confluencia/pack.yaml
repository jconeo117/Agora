# Primera cadena económica (D-058): un bien es un eje de progresión más, y
# representa VALOR ponderado por calidad -- la aptitud de quien fabrica ya
# hace ese trabajo (`gain_multipliers`), sin un campo de calidad aparte.
- id: hierro
