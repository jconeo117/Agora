# Puerta mínima, no de clase: cualquiera puede minar, pero no cualquiera SABE
# minar todavía. `aprender_mineria`/`aprender_forja` no piden nada -- son el
# punto de partida -- así que no hay candado sin llave: el umbral se cruza
# solo con tiempo, nunca con una ficha que no se puede cambiar.
- id: saber_minar
  label: saber minar
  decay_per_tick: 0.0
  initial: 0.0
  progression: true
