# CLASES de grupo, no grupos (D-090). Este pack no declara ni una faccion: las
# funda la gente. Es el reparto de siempre -- el pack dice que es un gremio y el
# mundo dice cuales hay-- y es lo que hace posible que emerjan.
faction_kinds:
# Un oficio organizado. No exclusivo: se puede estar en dos gremios, que es
# distinto de tener dos patrias.
- id: gremio
  label: gremio
  company_multiplier: 1.7
  lealtad_inicial: 0.45
  lealtad_minima: 0.12
  # Hay que sostenerla. Sin esto, entrar una vez es ser de los suyos para
  # siempre -- el mismo error que las parejas eternas de antes de D-087. A
  # 0.00012 por tick, quien no hace nada por el gremio tarda unos 80 dias en
  # caer del 0.45 de entrada al 0.12 que lo deja fuera.
  lealtad_por_tick: 0.00012
# Una casa es un APELLIDO, no una nobleza: la linea de sangre a la que
# perteneces. Exclusiva —no se tienen dos apellidos— y sin desgaste, porque de
# los tuyos no se deja de ser por no verlos. La nobleza, si llega, sera un
# titulo ENCIMA de esto y no esto mismo.
#
# No hay accion que funde una, y es el punto entero: un apellido no se decide.
# Empieza cuando hay a quien pasarselo, asi que lo funda el primer parto de una
# pareja que no tenga ninguno (D-129). Colgarlo de una accion la habria dejado
# compitiendo con `charlar` por el vinculo, que es la pelea que este mundo lleva
# cinco mecanismos perdiendo (E-009) -- y de hecho la version por accion salio a
# CERO casas en 400 dias.
- id: casa
  label: casa
  exclusive: true
  company_multiplier: 2.0
  lealtad_inicial: 0.6
  # Y hereda lo que uno de los suyos deja sin nadie de sangre (D-130). Cierra
  # D-057: hasta ahora eso se quedaba sin dueno y se evaporaba, y sin
  # patrimonio acumulado no hay casas ricas ni pobres -- ni nada que un titulo
  # de nobleza pueda reconocer.
  hereda: true
  # Y el prestigio se enfria (D-133). Que un apellido mantenga su peso entre
  # generaciones tiene que ser trabajo de los hijos: sin desgaste, una sola
  # hazana sostiene un linaje para siempre.
  #
  # 0.000006 y no 0.0000035: con el desgaste flojo una casa llegaba a 1.000 en
  # dos anyos de corrida y el apellido dejaba de decir nada -- si todos los que
  # importan estan en el techo, el techo no distingue. A este ritmo pierde 0.21
  # al anyo, asi que media hazana se evapora en anyo y medio si nadie hace nada
  # mas. Va junto con el rendimiento decreciente de D-136: uno frena la subida
  # y el otro tira hacia abajo.
  prestigio_por_tick: 0.000006
relations:
# La pareja deja de ser eterna (D-087). El README decia que una relacion con
# nombre no se disuelve nunca, y valia mientras las unicas fueran de sangre y de
# oficio; con noviazgos es falso: a quien no ves desde hace meses no es tu
# pareja.
#
# `se_rompe_sin_verse: 8640` son noventa dias de este reloj: el corte duro.
# `se_rompe_bajo: 0.08` es la cuesta abajo, sobre el aprecio DESDIBUJADO -- con
# el desdibujado de este mundo (0.9997 por tick), un aprecio de 0.5 tarda unos
# 56 dias sin verse en caer a 0.1. Sobre el crudo estaba inerte: la ausencia no
# baja el valor crudo, asi que una pareja que deja de verse lo conservaba
# intacto para siempre (medido: 0 rupturas en 120 dias).
#
# Y no sobre el que devuelve `regard_for`, que aplica el suelo: con el suelo
# puesto, `regard_floor: 0.45` haria imposible romper por desamor.
- id: pareja
  label: pareja
  symmetric: true
  exclusive: true
  regard_floor: 0.45
  company_multiplier: 2.0
  se_rompe_sin_verse: 8640
  se_rompe_bajo: 0.08
- id: hermano
  label: hermano
  symmetric: true
  company_multiplier: 1.5
- id: maestro
  label: maestro de
  inverse: discipulo
  regard_floor: 0.2
  company_multiplier: 1.4
- id: discipulo
  label: discipulo de
  inverse: maestro
  regard_floor: 0.3
  company_multiplier: 1.6
# Sangre (D-071). Dos pares y no uno: quien te llevo y quien te engendro son
# dos papeles distintos, y un hijo puede tener el primero sin el segundo -- si
# el padre murio durante la espera, nace huerfano y esa relacion no se crea.
#
# `hereda: true` en las dos, que es lo que enlaza descendencia con propiedad:
# hasta hoy `RelationSpec.hereda` (D-055) solo podia repartir entre gente ya
# escrita en el YAML, porque no habia forma de nombrar herederos nuevos.
#
# Sin `regard_floor`: por lo mismo que `hermano` no lo lleva (D-034). Un padre
# sin suelo de aprecio modela al padre que nunca reconocio a su hijo, y ese
# padre tiene que poder existir.
# `hereda` va en la relación que sostiene EL HEREDERO hacia el difunto, o sea en
# `hijo_de_*` y no en `madre`/`padre`: es el lado del hijo el que se recorre al
# buscar herederos. Estuvo al revés y no fallaba nada visible -- solo que las
# madres heredaban de sus hijos y los hijos no heredaban de nadie.
- id: hijo_de_madre
  label: hijo de
  inverse: madre
  company_multiplier: 2.2
  hereda: true
- id: madre
  label: madre de
  inverse: hijo_de_madre
  company_multiplier: 2.2
- id: hijo_de_padre
  label: hijo de
  inverse: padre
  company_multiplier: 1.9
  hereda: true
- id: padre
  label: padre de
  inverse: hijo_de_padre
  company_multiplier: 1.9
# Un lazo que NO es de sangre y nace de algo que alguien hizo (D-082): el
# adulto que se acerca a un crio que ya aprecia acaba siendo suyo de otra
# manera. Es el primer lazo de este mundo que no estaba escrito antes del tick
# cero ni sale de un parto.
#
# Sin `hereda`: un padrino no es un progenitor, y la herencia es un hecho
# legal. Y sin `regard_floor`, como la sangre: se apadrina a quien se quiere,
# no se quiere a quien se apadrina.
- id: padrino
  label: padrino de
  inverse: ahijado
  company_multiplier: 1.6
- id: ahijado
  label: ahijado de
  inverse: padrino
  company_multiplier: 1.6
properties:
# Primer uso real de Propiedad en este pack (D-053/D-063): deudas de dinero a
# mano, no generadas dinámicamente todavía -- crear préstamos sobre la marcha
# ("prestar_dinero") queda para una pasada futura. `renta` aquí es el goteo
# pasivo que ya cobra `_aplicar_rentas` cada tick; `cobrar_deuda` es el
# sobresalto violento que se le suma encima cuando el asesino decide ir a
# buscarlo, no un segundo cobro del mismo goteo.
#
# Cuatro deudas repartidas entre tres acreedores, y cada deudor comparte
# `home` con su acreedor a propósito -- confluencia es un mundo violento
# (802 muertes/90 días medidas) y un único par puede perder al deudor antes
# de que el motor tenga ocasión de cobrarle nada. Compartir casa no evita la
# muerte, pero multiplica las ocasiones de encuentro mientras ambos viven.
# PATRIMONIO (D-134). Primer uso real de LUGAR y OBJETO, que llevaban
# implementados desde D-053 sin que ningun pack los tocara. Hasta aqui este
# mundo solo declaraba cuatro deudas, asi que las casas tenian donde acumular
# y nada que acumular: medido a 400 dias, 7 propiedades en total y ninguna de
# una casa.
#
# Cuatro clases, sorteadas por blake2b del id como el genero y la edad:
#   tierras    un lugar del mapa, lo mas rentable y lo mas escaso
#   talleres   con lo que se produce
#   tiendas    con lo que se vende
#   academias  no rinden dinero sino RENOMBRE -- tener una escuela a tu nombre
#              te hace conocido, y eso en este mundo es `dominio`
#
# RENTAS BAJAS, y esto costo una medicion: con 0.005-0.012 por tick la oferta
# de dinero paso de 1.11 a 1.44 y el panel lo declaro MUERTO -- un eje por
# encima de 1.3 deja de decidir nada, y con el se llevo a `deseo` a 1.35 por
# arrastre. Divididas por cinco, el eje aguanta y sigue habiendo algo que
# heredar: lo que se busca no es que nadie se haga rico en un anyo, sino que al
# morir quede patrimonio.
