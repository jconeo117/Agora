# =============================================================================
# Content pack: barrio urbano contemporáneo.
#
# Reloj: 1 tick = 15 minutos -> 96 ticks por día.
#
# Diez residentes con nombre. Cada uno vive en su habitacion y esta anclado a
# un oficio por gusto; el resto de su conducta emerge de ocho ejes de caracter.
# =============================================================================

id: barrio
label: "El barrio"

clock:
  minutes_per_tick: 15
  ticks_per_day: 96

# -----------------------------------------------------------------------------
# CONTRATO DE SALUD
#
# Qué clase de mundo quiere ser este barrio, en forma verificable. No son
# parámetros: son intención de diseño, y saltan cuando deja de cumplirse.
#
# Las bandas van holgadas respecto a lo medido a propósito. Un umbral pegado al
# valor actual convertiría cualquier calibración en un test roto, y calibrar es
# justamente el trabajo que esto tiene que permitir.
# -----------------------------------------------------------------------------
health:
  days: 7
  seeds: [1312, 7, 99]

  # Gente bajo presión moderada. Ni miseria ni abundancia: en los dos extremos
  # el carácter deja de notarse, y está medido — con todo resuelto los diez
  # convergen en la opción óptima.
  min_crisis: 0.05          # medido: 15.0 %
  max_crisis: 0.30

  max_abort_ratio: 0.20     # medido: 11.1 %
  max_transit: 0.25         # medido: 17.8 %
  min_differentiation: 0.70 # medido: 0.891

  # La red de seguridad: en un mundo sano nadie debería necesitarla. Cualquier
  # OTRA acción sin usar sí sería un aviso.
  may_go_unused: [holgazanear]

# -----------------------------------------------------------------------------
# CALIBRACIÓN
# -----------------------------------------------------------------------------
tuning:
  # 21 lugares y trayectos más largos que en la aldea: el descuento pesa más.
  # 0.93 ** 6 = 0.65  -> ir a la oficina cuesta un 35 % de atractivo.
  travel_discount: 0.93
  candidate_pool: 3
  temperature: 0.12

  # Cuánto pesa perder frente a ganar. 1.0 = neutral; 1.5-2.0 = gente prudente;
  # 0.5 = gente que vive el momento; 0.0 desactiva los costes por completo.
  loss_aversion: 1.0

  # Hastío por repetición. La ganancia va por acción (ver `saturation_gain`);
  # esto es lo que se disipa por tick y cuánto castiga estar harto.
  # A 0.004, un hastío de 0.35 se pasa en ~88 ticks, algo menos de un día.
  saturation_recovery: 0.004
  # Tope del castigo: 0.6 = como mucho un 40 % menos de atractivo. Nunca cero,
  # o un agente harto de comer se dejaría morir de hambre antes que repetir.
  novelty_weight: 0.6

  # Cuánto protege lo ya invertido. 0.8 = casi al final solo una catástrofe
  # corta lo que estás haciendo. El "ya que estoy, lo termino".
  switch_cost: 0.8

  # Cuánto corrige el agente sus expectativas tras cada experiencia. Bajo a
  # propósito: a 0.10 hacen falta unas veinte veces para que una creencia se
  # asiente. Un NPC que aprende deprisa cambia de opinión con cada anécdota.
  learning_rate: 0.10

  # Tercera capa del temperamento: cómo decide alguien que está al límite.
  # El exponente es el desgaste (0 entero, 1 destrozado), así que un agente
  # entero no se ve afectado. Produce los "días malos" sin tocar la
  # personalidad: el mismo NPC decide distinto según cómo esté.
  strain_multipliers:
    temperature: 2.2        # agotado se decide peor, más a lo tonto
    travel_discount: 0.85   # y cruzar el barrio pesa más de lo que pesaría
    # Al límite, todo parece una emergencia. Esto no se pudo conectar cuando se
    # metió el desgaste porque la regla de interrupción tenía el sentido
    # invertido: subir el umbral daba coartada en vez de alarmar, y un agente
    # agotado habría interrumpido MENOS. Con el triaje ya arreglado, funciona.
    critical_need_threshold: 1.5

  critical_need_threshold: 0.15

# -----------------------------------------------------------------------------
# NECESIDADES
#
# `provisiones` es la que hace que las tiendas existan: cocinar la consume,
# comprar la repone. De ahí sale la disyuntiva cocinar barato / comer fuera caro.
# Y con `requires` en las acciones, la despensa vacía impide cocinar de verdad:
# medido, obliga a pasar por el mercado unas cuatro veces por semana.
#
# `strain_weight` marca las que desgastan la cabeza cuando escasean. El dinero
# aprieta pero no te vuelve torpe, así que va a cero.
# -----------------------------------------------------------------------------
needs:
  - id: sustento
    label: "sustento"
    decay_per_tick: 0.007      # vacío en ~36 h; ~1.3 comidas al día lo cubren
    initial: 0.75
    base_weight: 1.0
    urgency_exponent: 2.5      # irrelevante hasta que es tirano
    strain_weight: 0.9                 # y el hambre justo despues

  - id: descanso
    label: "descanso"
    decay_per_tick: 0.007      # vacío en ~36 h; un sueño al día lo cubre
    initial: 0.85
    base_weight: 1.0
    urgency_exponent: 2.2
    strain_weight: 1.0                 # el agotamiento es lo que mas nubla

  - id: dinero
    label: "dinero"
    decay_per_tick: 0.0008     # coste de vida: sangría lenta y constante
    initial: 0.55
    base_weight: 0.9
    urgency_exponent: 1.6      # casi lineal: siempre se piensa un poco en ello

  - id: vinculo
    label: "vínculo"
    decay_per_tick: 0.0040     # vacío en ~2.6 días
    initial: 0.60
    base_weight: 0.75
    urgency_exponent: 1.9
    strain_weight: 0.3                 # la soledad tambien, menos
    # Igual al decay: rodeado de gente la soledad deja de crecer, pero no se
    # cura. Para eso hay que hablar con alguien. Con una persona al lado el
    # alivio es la mitad (saturación n/(n+1)).
    company_relief: 0.0040

  - id: estimulo
    label: "estímulo"
    decay_per_tick: 0.0040     # vacío en ~2.6 días
    initial: 0.55
    base_weight: 0.65
    urgency_exponent: 1.7
    strain_weight: 0.4                 # el aburrimiento desgasta, pero poco

  - id: provisiones
    label: "provisiones"
    decay_per_tick: 0.0012     # merma lenta; lo que de verdad la vacía es cocinar
    initial: 0.70
    base_weight: 0.50
    urgency_exponent: 1.4

# -----------------------------------------------------------------------------
# RASGOS
#
# Cinco ejes independientes. La intensidad del agente (-1..1) entra como
# exponente: 0 no hace nada, -1 invierte exactamente el multiplicador.
# -----------------------------------------------------------------------------
traits:
  - id: sociabilidad
    label: "sociabilidad"
    need_weight_multipliers:
      vinculo: 2.2
      descanso: 0.9

  - id: laboriosidad
    label: "laboriosidad"
    need_weight_multipliers:
      dinero: 1.6
      descanso: 0.75          # subestima su propio cansancio

  - id: hedonismo
    label: "hedonismo"
    need_weight_multipliers:
      estimulo: 2.4
      dinero: 0.7             # gasta sin pensarlo

  - id: frugalidad
    label: "frugalidad"
    need_weight_multipliers:
      dinero: 1.5
      provisiones: 1.6        # prefiere despensa llena a restaurante
      estimulo: 0.6

  - id: apego_al_hogar
    label: "apego al hogar"
    need_weight_multipliers:
      descanso: 1.35
      vinculo: 0.7

  # ---------------------------------------------------------------------------
  # TEMPERAMENTO. Estos tres no dicen QUÉ le importa al agente, sino CÓMO
  # decide. Se componen sobre los valores del mundo declarados en `tuning`.
  #
  # No hacen falta rasgos opuestos: la intensidad negativa ya invierte. El
  # metódico es el impulsivo con el signo cambiado.
  # ---------------------------------------------------------------------------

  - id: impulsividad
    label: "impulsividad"
    temperament_multipliers:
      temperature: 3.0        # +1 errático · -1 metódico, siempre lo mejor
      loss_aversion: 0.55     # y además no se para a mirar el precio

  - id: aguante
    label: "aguante"
    temperament_multipliers:
      # Suave a propósito. A 0.35, un -1 multiplicaba el umbral por 2.86 y metía
      # al personaje en crisis permanente — y la crisis homogeniza, porque en
      # emergencia todo el mundo hace lo mismo. Medido: bajarlo de 0.35 a 0.60
      # recorta el peor caso de crisis del 75% al 65% sin costar diferenciación.
      #
      # Y ahora significa de verdad lo que dice: con la regla de interrupción
      # por triaje, más aguante es menos abandonos. Medido sobre diez clones que
      # solo difieren en este eje, la correlación es -0.44.
      critical_need_threshold: 0.60   # +1 estoico · -1 se desmorona pronto

  - id: arraigo
    label: "arraigo"
    temperament_multipliers:
      travel_discount: 0.80   # +1 no sale del barrio · -1 cruza la ciudad

# -----------------------------------------------------------------------------
# ACCIONES
#
# `satisfies` = lo que el agente CREE que gana al deliberar.
# `costs`     = lo que CREE que pierde. MISMA escala que satisfies (0..1):
#               "cuánto va esta acción de gastar eso".
# `effects`   = lo que realmente ocurre al completar. Otra escala: es el delta.
#
# Los costes NO se derivan de los efectos negativos precisamente por esa
# diferencia de escala. Y todo efecto negativo obliga a declarar su coste; se
# admite 0.0 explícito para modelar a alguien que no lo ve venir.
#
# El reparto económico de este barrio, de gratis a lujo:
#   gratis    dormir, descansar, tomar el aire, holgazanear
#   barato    charlar
#   medio     cocinar, los tres oficios
#   caro      comer fuera, hacer la compra
#   lujo      darse un capricho, salir de fiesta
# -----------------------------------------------------------------------------
actions:
  # --- descanso: no cuesta nada salvo tiempo, y el tiempo aún no se modela ---
  - id: dormir
    label: "dormir"
    duration_ticks: 30                # 7 h 30
    requires_affordance: lecho
    satisfies: { descanso: 1.0 }
    effects:  { descanso: +0.95 }

  - id: descansar
    label: "descansar en casa"
    duration_ticks: 8                 # 2 h
    requires_affordance: lecho
    satisfies: { descanso: 0.40, estimulo: 0.15 }
    effects:  { descanso: +0.30, estimulo: +0.08 }
    saturation_gain: 0.35

  # --- comida: aquí está la disyuntiva económica principal del barrio ---
  - id: cocinar
    label: "cocinar y comer en casa"
    duration_ticks: 6                 # 1 h 30
    requires_affordance: cocina
    satisfies: { sustento: 0.90 }
    requires: { provisiones: 0.22 }   # sin despensa no se cocina
    costs:    { provisiones: 0.45, dinero: 0.05 }   # vacía la despensa, no la cartera
    effects:  { sustento: +0.72, provisiones: -0.22, dinero: -0.01 }
    saturation_gain: 0.1

  - id: comer_fuera
    label: "comer fuera"
    duration_ticks: 5                 # 1 h 15
    requires_affordance: mesa
    satisfies: { sustento: 1.0, vinculo: 0.20 }
    requires: { dinero: 0.15 }        # y la cuenta sube si hay compañía
    costs:    { dinero: 0.50 }                      # comer fuera VA de gastar
    effects:  { sustento: +0.85, dinero: -0.09, vinculo: +0.08 }
    # Comer acompañado sube la cuenta. Poco, pero suficiente para que el precio
    # de esta acción no sea siempre el mismo y haya algo que aprender de él.
    effects_per_company: { dinero: -0.06, vinculo: +0.10 }
    saturation_gain: 0.12

  # --- compras ---
  - id: hacer_compras
    label: "hacer la compra"
    duration_ticks: 7
    requires_affordance: comercio
    satisfies: { provisiones: 1.0 }
    requires: { dinero: 0.12 }        # y la compra
    costs:    { dinero: 0.40 }
    effects:  { provisiones: +0.75, dinero: -0.12 }
    saturation_gain: 0.15

  - id: darse_un_capricho
    label: "darse un capricho"
    duration_ticks: 5
    requires_affordance: capricho
    satisfies: { estimulo: 0.70 }
    requires: { dinero: 0.16 }        # el lujo es lo primero que se cae
    costs:    { dinero: 0.55 }                      # caro, pero alcanzable
    effects:  { estimulo: +0.45, dinero: -0.16 }
    saturation_gain: 0.3
    tags: [gasto]

  # --- trabajo: tres oficios con equilibrios distintos ---
  #
  # La escala de coste sube de oficina a almacén: mismo dinero cada vez peor
  # pagado y cada vez más castigo. Un almacenero agotado deja de ver rentable
  # su turno; lo que lo sostiene es el gusto por su oficio, que multiplica el
  # beneficio. Ahí se ve que el ancla laboral y el coste tiran en direcciones
  # opuestas, como debe ser.
  - id: trabajar_en_oficina
    label: "trabajar en la oficina"
    duration_ticks: 32                # 8 h
    requires_affordance: labor_administrativa
    satisfies: { dinero: 1.0 }
    costs:    { descanso: 0.28, sustento: 0.20 }
    effects:  { dinero: +0.33, descanso: -0.16, sustento: -0.10, vinculo: +0.05 }

  - id: trabajar_en_taller
    label: "trabajar en el taller"
    duration_ticks: 28                # 7 h
    requires_affordance: labor_taller
    satisfies: { dinero: 0.90 }
    costs:    { descanso: 0.38, sustento: 0.24 }
    effects:  { dinero: +0.29, descanso: -0.22, sustento: -0.12 }
    tags: [agotadora]

  - id: trabajar_en_almacen
    label: "trabajar en el almacén"
    duration_ticks: 24                # 6 h
    requires_affordance: labor_almacen
    satisfies: { dinero: 0.80 }
    costs:    { descanso: 0.48, sustento: 0.26 }
    effects:  { dinero: +0.24, descanso: -0.26, sustento: -0.13 }
    tags: [agotadora]

  # --- social ---
  - id: charlar
    label: "charlar"
    duration_ticks: 6
    requires_affordance: tertulia
    requires_company: 1               # no se charla solo
    satisfies: { vinculo: 1.0 }
    costs:    { descanso: 0.10 }                    # casi gratis: su ventaja
    effects:  { vinculo: +0.30, estimulo: +0.10, descanso: -0.03 }
    # Con una persona sale +0.55 (como antes); con tres, +0.68. Ahí está la
    # varianza que hace que haya algo que aprender: entre decidir ir a la plaza
    # y llegar, la gente se mueve, y la conversación sale mejor o peor.
    effects_per_company: { vinculo: +0.50 }
    saturation_gain: 0.2
    tags: [social]

  - id: salir_de_fiesta
    label: "salir de fiesta"
    duration_ticks: 14                # 3 h 30
    requires_affordance: jolgorio
    # SIN requires_company, y es deliberado. Al ponerlo, la acción se
    # auto-bloqueó: nadie iba al club porque no había nadie, y no había nadie
    # porque nadie iba. El fallo era de modelado — un club está lleno de
    # desconocidos, y estos diez no son las únicas personas del barrio.
    #
    # `charlar` es con alguien CONCRETO y sí exige un agente al lado. Salir de
    # fiesta es ir a un local con gente que no simulamos. Cuando existan las
    # multitudes anónimas como propiedad del lugar, esto se modelará bien.
    satisfies: { estimulo: 1.0, vinculo: 0.60 }
    requires: { dinero: 0.36 }        # y con gente sale bastante más cara
    costs:    { dinero: 0.75, descanso: 0.60 }      # cara por los dos lados
    effects:  { estimulo: +0.55, vinculo: +0.20, descanso: -0.30, dinero: -0.20 }
    # Una noche con gente conocida no es una noche entre desconocidos: rinde
    # más, y también sale más cara. La varianza en el precio es lo que permite
    # aprender que algo cuesta más de lo que parecía.
    effects_per_company: { estimulo: +0.50, vinculo: +0.30, dinero: -0.16 }
    saturation_gain: 0.4
    tags: [social, gasto, agotadora]

  - id: tomar_el_aire
    label: "tomar el aire"
    duration_ticks: 6
    requires_affordance: aire_libre
    satisfies: { estimulo: 0.45, descanso: 0.15 }
    effects:  { estimulo: +0.28, descanso: +0.05 }  # el estímulo del que no llega
    saturation_gain: 0.25

  # --- red de seguridad: sin affordance, válida en cualquier sitio ---
  - id: holgazanear
    label: "holgazanear"
    duration_ticks: 4
    satisfies: { descanso: 0.12 }
    effects:  { descanso: +0.04 }
    # SIN saturation_gain, y es importante: es la última opción cuando nada
    # compensa. Hastiarla podría dejar a un agente sin nada que hacer.

# -----------------------------------------------------------------------------
# LUGARES
#
# El vestíbulo es el corazón del edificio: cocina común y zona de tertulia. Es
# donde los vecinos se cruzan sin haberlo buscado.
#
# La plaza es el nudo del barrio. Todo pasa por ella, así que es donde se
# producirán la mayoría de encuentros no domésticos.
# -----------------------------------------------------------------------------
places:
  # --- edificio ---
  - id: vestibulo
    label: "el vestíbulo del edificio"
    affordances: [cocina, tertulia]
    tags: [interior, comunitario]
    neighbors:
      hab_01: 1
      hab_02: 1
      hab_03: 1
      hab_04: 1
      hab_05: 1
      hab_06: 1
      hab_07: 1
      hab_08: 1
      hab_09: 1
      hab_10: 1
      plaza: 1        # salir del edificio no puede costar 45 min

  - id: hab_01
    label: "la habitación 1"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }
  - id: hab_02
    label: "la habitación 2"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }
  - id: hab_03
    label: "la habitación 3"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }
  - id: hab_04
    label: "la habitación 4"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }
  - id: hab_05
    label: "la habitación 5"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }
  - id: hab_06
    label: "la habitación 6"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }
  - id: hab_07
    label: "la habitación 7"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }
  - id: hab_08
    label: "la habitación 8"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }
  - id: hab_09
    label: "la habitación 9"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }
  - id: hab_10
    label: "la habitación 10"
    affordances: [lecho]
    tags: [interior, privado]
    neighbors: { vestibulo: 1 }

  # --- zonas sociales ---
  - id: plaza
    label: "la plaza"
    affordances: [tertulia, aire_libre]
    tags: [exterior, publico, nudo]
    neighbors: { vestibulo: 1, cafe: 1, fonda: 1, mercado: 2, bazar: 2, oficina: 2 }

  - id: cafe
    label: "el café"
    affordances: [tertulia, mesa]
    tags: [interior, publico, tranquilo]
    neighbors: { plaza: 1, restaurante: 1 }

  - id: club
    label: "el club nocturno"
    affordances: [jolgorio, tertulia]
    tags: [interior, publico, ruidoso]
    neighbors: { bazar: 2, restaurante: 1 }

  # --- tiendas ---
  - id: mercado
    label: "el mercado"
    affordances: [comercio]
    tags: [interior, publico]
    neighbors: { plaza: 2, almacen: 2 }

  - id: bazar
    label: "el bazar"
    affordances: [comercio, capricho]
    tags: [interior, publico]
    neighbors: { plaza: 2, club: 2 }

  # --- restaurantes ---
  - id: fonda
    label: "la fonda"
    affordances: [mesa]
    tags: [interior, publico, barato]
    neighbors: { plaza: 1 }

  - id: restaurante
    label: "el restaurante"
    affordances: [mesa, tertulia]
    tags: [interior, publico, caro]
    neighbors: { cafe: 1, club: 1 }

  # --- trabajo ---
  - id: oficina
    label: "la oficina"
    affordances: [labor_administrativa]
    tags: [interior, laboral]
    neighbors: { plaza: 2, taller: 2 }

  - id: taller
    label: "el taller"
    affordances: [labor_taller]
    tags: [interior, laboral]
    neighbors: { oficina: 2, almacen: 2 }

  - id: almacen
    label: "el almacén"
    affordances: [labor_almacen]
    tags: [interior, laboral]
    neighbors: { taller: 2, mercado: 2 }

# -----------------------------------------------------------------------------
# AGENTES — RELLENO TEMPORAL
#
# Sin personalidad: rasgos repartidos mecánicamente para poder medir el entorno
# a escala. Se sustituyen por los personajes reales.
#
# Dos gustos por agente, y ambos hacen trabajo estructural:
#   - su propia habitación -> emerge "duermo en mi cuarto" sin control de acceso
#   - su propio oficio     -> lo ancla a un puesto en vez de ir al mejor pagado
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# RESIDENTES
#
# Dos gustos hacen trabajo estructural en todos: la propia habitacion (de ahi
# emerge "duermo en mi cuarto" sin control de acceso) y el propio oficio (lo
# ancla a un puesto en vez de ir al mejor pagado). El resto son caracter.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# RESIDENTES
#
# Dos gustos hacen trabajo estructural en todos: la propia habitacion (de ahi
# emerge "duermo en mi cuarto" sin control de acceso) y el propio oficio (lo
# ancla a un puesto en vez de ir al mejor pagado). El resto son caracter.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# RESIDENTES
#
# Dos gustos hacen trabajo estructural en todos: la propia habitacion (de ahi
# emerge "duermo en mi cuarto" sin control de acceso) y el propio oficio (lo
# ancla a un puesto en vez de ir al mejor pagado). El resto son caracter.
# -----------------------------------------------------------------------------
agents:

- id: alexia
  label: "Alexia"
  home: hab_01
  start_at: hab_01
  traits:
    sociabilidad: 0.9
    hedonismo: 0.6
    apego_al_hogar: -0.8
    impulsividad: 0.7
    arraigo: -0.8
  tastes:
    - { target: trabajar_en_taller, multiplier: 2.5 }
    - { target: plaza, multiplier: 2.3 }
    - { target: club, multiplier: 1.8 }
    - { target: hab_01, multiplier: 0.25 }
  initial_needs: {}

- id: karla
  label: "Karla"
  home: hab_02
  start_at: hab_02
  traits:
    sociabilidad: -0.7
    frugalidad: 0.8
    apego_al_hogar: 0.7
    impulsividad: -0.6
    arraigo: 0.6
  tastes:
    - { target: trabajar_en_oficina, multiplier: 2.5 }
    - { target: club, multiplier: 0.1 }
    - { target: cocinar, multiplier: 1.8 }
    - { target: hab_02, multiplier: 1.7 }
  initial_needs: {}

- id: kiara
