# El sistema de rol de la mesa: el borrador 1 de la «Especificación mecánica
# del TTRPG» (2026-10-09), en modo progresivo (D-156). Aquí solo va lo que
# cambia con la mesa; armas, estados con nombre y técnicas son del pack (D-153).
id: base
label: Borrador 1, modo progresivo

attributes:
  - {id: fuerza, label: Fuerza}
  - {id: agilidad, label: Agilidad}
  - {id: ingenio, label: Ingenio}
  - {id: instinto, label: Instinto}
  - {id: voluntad, label: Voluntad}
  - {id: presencia, label: Presencia}
  - {id: resonancia, label: Resonancia, minimum: 0}

# Valor 1-3 grado 1, 4-6 grado 2, 7-10 grado 3, 11-15 grado 4, 16-21 grado 5,
# 22-30 grado 6 (§5.2). Los tramos se alargan: cada grado cuesta más.
grades:
  - {grade: 1, min_value: 1}
  - {grade: 2, min_value: 4}
  - {grade: 3, min_value: 7}
  - {grade: 4, min_value: 11}
  - {grade: 5, min_value: 16}
  - {grade: 6, min_value: 22}

tiers:
  - {tier: 1, label: Novato, min_level: 1, max_level: 4, attribute_cap: 10}
  - {tier: 2, label: Veterano, min_level: 5, max_level: 8, attribute_cap: 15}
  - {tier: 3, label: Héroe, min_level: 9, max_level: 12, attribute_cap: 20}
  - {tier: 4, label: Leyenda, min_level: 13, max_level: 16, attribute_cap: 25}
  - {tier: 5, label: Mito, min_level: 17, max_level: 20, attribute_cap: 30}

skill_max_level: 4

skills:
  - {id: armas_cuerpo_a_cuerpo, label: Armas cuerpo a cuerpo, attribute: fuerza, approaches: [agilidad, instinto]}
  - {id: armas_a_distancia, label: Armas a distancia, attribute: agilidad, approaches: [instinto]}
  - {id: combate_sin_armas, label: Combate sin armas, attribute: fuerza, approaches: [agilidad]}
  - {id: defensa, label: Defensa, attribute: agilidad, approaches: [fuerza, instinto]}
  - {id: atletismo, label: Atletismo, attribute: fuerza, approaches: [agilidad]}
  - {id: acrobacia, label: Acrobacia, attribute: agilidad}
  - {id: sigilo, label: Sigilo, attribute: agilidad, approaches: [instinto]}
  - {id: aguante, label: Aguante, attribute: fuerza, approaches: [voluntad]}
  - {id: alerta, label: Alerta, attribute: instinto}
  - {id: rastreo, label: Rastreo, attribute: instinto, approaches: [ingenio]}
  - {id: supervivencia, label: Supervivencia, attribute: instinto, approaches: [ingenio]}
  - {id: artesania, label: Artesanía, attribute: ingenio, approaches: [agilidad]}
  - {id: medicina, label: Medicina, attribute: ingenio, approaches: [agilidad]}
  - {id: prestidigitacion, label: Prestidigitación, attribute: agilidad}
  - {id: doma, label: Doma, attribute: presencia, approaches: [instinto]}
  - {id: canalizacion, label: Canalización, attribute: resonancia, approaches: [voluntad]}
  - {id: formulacion, label: Formulación, attribute: ingenio, approaches: [resonancia]}
  - {id: porte, label: Porte, attribute: presencia, approaches: [voluntad]}

pool:
  cap: 6
  overflow_cap: 2      # a calibrar (§25.1 del borrador)
  resist_stress: 3     # a calibrar (§25.2)

vitality:
  wounded_below: 50    # a calibrar (§25.2)
  grave_below: 25

# Lo que un encuentro necesita saber del sistema (unidad 09). Los papeles se
# nombran por id: el código de las reglas no sabe qué es la fuerza de nadie.
combat:
  initiative: [agilidad, instinto]      # §9.1: valores + 1d6
  initiative_tiebreak: instinto
  defense_skill: defensa
  resist_skill: aguante
  first_aid_skill: medicina
  break_attribute: voluntad
  strength_attribute: fuerza            # +1 de perforación (§10.3)
  agile_attribute: agilidad             # exige arma ágil (§14.1)
  defense_step: 1                       # a calibrar (§25.2)
  total_defense_bonus: 2
  force_fatigue: 2                      # a calibrar (§25.2)
  recover_fatigue: 2
  long_fight_every: 4
  death_clock: 4
  tired_at: 50
  exhausted_at: 75
  max_rounds: 30
  chase_skill: atletismo                # D-165: huir es una persecución
  chase_clock: 3
  # Cómo pide un jugador cada acción de la escena (unidad 14). Las lee el
  # intérprete de la prosa, nunca la escena.
  examples:
    atacar: [ataco a, le golpeo, le pego, voy a por]
    defensa_total: [me cubro, me defiendo, aguanto a la defensiva]
    recuperar_aliento: [recupero el aliento, tomo aire, me tomo un respiro]
    primeros_auxilios: [socorro a, le vendo la herida, ayudo a]
    rematar: [remato a, acabo con, le doy el golpe de gracia]
    huir: [huyo, salgo corriendo, escapo]
    rendirse: [me rindo, pido clemencia, tiro el arma]
  # Cómo cuenta el narrador cada hecho de la escena (unidad 17), por acción o
  # por acción.resultado: tú / otro / otro sobre ti. El daño llega en bandas
  # («, un buen golpe»), nunca en números.
  narration:
    atacar.failure: {you: "atacas a {o}, sin alcanzarle", them: "{a} ataca a {o}, sin alcanzarle", at_you: "{a} te ataca, sin alcanzarte"}
    atacar.success_at_cost: {you: "alcanzas a {o}{d}, pero te expones", them: "{a} alcanza a {o}{d}, pero se expone", at_you: "{a} te alcanza{d}, pero se expone"}
    atacar.success: {you: "alcanzas a {o}{d}", them: "{a} alcanza a {o}{d}", at_you: "{a} te alcanza{d}"}
    atacar.critical: {you: "aciertas de lleno a {o}{d}", them: "{a} acierta de lleno a {o}{d}", at_you: "{a} te acierta de lleno{d}"}
    huir.failure: {you: "intentas huir, pero {o} te corta el paso", them: "{a} intenta huir, pero {o} le corta el paso", at_you: "{a} intenta huir y le cortas el paso"}
    huir.success_at_cost: {you: "le ganas algo de distancia a {o}, a duras penas", them: "{a} le gana algo de distancia a {o}", at_you: "{a} te gana algo de distancia"}
    huir.success: {you: "le sacas ventaja a {o} en la huida", them: "{a} le saca ventaja a {o}", at_you: "{a} te saca ventaja en la huida"}
    huir.critical: {you: "dejas atrás a {o}", them: "{a} deja atrás a {o}", at_you: "{a} te deja atrás"}
    huir: {you: "escapas; nadie te sigue", them: "{a} escapa; nadie le sigue"}
    rematar: {you: "rematas a {o}", them: "{a} remata a {o}", at_you: "{a} te remata"}
    primeros_auxilios: {you: "atiendes a {o}", them: "{a} atiende a {o}", at_you: "{a} te atiende"}
    defensa_total: {you: "te cubres", them: "{a} se cubre"}
    recuperar_aliento: {you: "recuperas el aliento", them: "{a} recupera el aliento"}
    rendirse: {you: "te rindes", them: "{a} se rinde"}
    quiebre: {you: "se te quiebra el ánimo", them: "a {a} se le quiebra el ánimo"}
    reloj_de_muerte: {you: "te desangras en el suelo", them: "{a} se desangra en el suelo"}
  content:
    atacar: [violencia]
    rematar: [violencia, muerte]
    reloj_de_muerte: [muerte]

# Con qué se miente y con qué se nota (unidad 15b): Porte contra Instinto +
# Alerta, las competencias que ya tiene el sistema.
social: {deceive: porte, notice: alerta}

# Las promesas del sistema (§24.4), cada una sobre un escenario de
# `escenarios/`. El simulador las comprueba como --health las de un pack.
calibration:
  - {scenario: espejo, side: a, win_min: 45, win_max: 55, rounds_min: 3, rounds_max: 6}
  - {scenario: un_tier, side: novata, win_min: 15, win_max: 30}
  - {scenario: un_tier_preparado, side: novata, win_min: 40, win_max: 60}
  - {scenario: dos_tiers, side: novata, win_min: 0, win_max: 10}
  - {scenario: tres_tiers, side: novata, win_min: 0, win_max: 0}

# Las capacidades de §5.3 (unidad 11). Cuánto queda de cada una lo dice el
# enlace de cada mundo con este sistema, no el sistema.
resources:
  vitality:                 # 10 + Fuerza + ⌊Voluntad / 2⌋
    base: 10
    terms: [{source: valor, id: fuerza}, {source: valor, id: voluntad, den: 2}]
  fatigue:                  # 4 + grado de Fuerza + Aguante
    base: 4
    terms: [{source: grado, id: fuerza}, {source: competencia, id: aguante}]
  stress:                   # 6 + grado de Voluntad
    base: 6
    terms: [{source: grado, id: voluntad}]
  impetus:                  # 3 + grado de Voluntad
    base: 3
    terms: [{source: grado, id: voluntad}]
